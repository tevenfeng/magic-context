# Magic Context bundle layer for DeepSeek Harness profiles.
# Inserted over the profile root; later layers (profile cordis.patch.yml,
# --patch overlays) may disable or reconfigure this entry by id. A patch
# replaces the row's whole `config`, so keep the shipped config complete here.
- insert:
    - id: mc-compaction
      name: '@cortexkit/dsh-magic-context'
      config:
        # auto registers the automatic step-pressure + overflow-recovery hooks.
        # The historian model resolves from (in priority order):
        #   1. summarizationProvider/summarizationModel below (when both set)
        #   2. .cortexkit/magic-context.jsonc  historian.model  ("provider/model")
        #   3. the session's routed model
        auto: true
        maxTokens: 8192
        thresholdRatio: 0.8
        retainRatio: 0.16
